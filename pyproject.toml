[tool.poetry]
name = "bugbounty-swarm"
version = "0.1.0"
description = "AI-powered bug bounty investigation swarm using Google ADK"
authors = ["BugBounty Swarm Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# API Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# Google Cloud
google-cloud-firestore = "^2.19.0"
google-cloud-tasks = "^2.16.0"
google-cloud-storage = "^2.18.0"
google-auth = "^2.35.0"

# Google ADK + Gemini
google-adk = "^1.0.0"
google-generativeai = "^0.8.0"

# HTTP Client
httpx = "^0.27.0"
anyio = "^4.6.0"

# Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

# Utilities
structlog = "^24.4.0"
python-dotenv = "^1.0.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
firebase-admin = "^6.5.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
