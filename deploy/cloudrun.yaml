apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bugbounty-swarm-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"  # Keep CPU active for SSE streaming
    spec:
      containerConcurrency: 20
      timeoutSeconds: 600
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/bugbounty-backend:latest
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: GCP_PROJECT_ID
              value: "YOUR_PROJECT_ID"
            - name: GCP_REGION
              value: "us-central1"
            - name: FIRESTORE_DATABASE
              value: "(default)"
            - name: CLOUD_TASKS_QUEUE
              value: "investigations"
            - name: CLOUD_TASKS_LOCATION
              value: "us-central1"
            - name: GCS_BUCKET_NAME
              value: "bugbounty-swarm-evidence"
            - name: RUNNER_BASE_URL
              value: "https://bugbounty-swarm-backend-YOUR_HASH-uc.a.run.app"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: swarm-api-secret
                  key: latest
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
